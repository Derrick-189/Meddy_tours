<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Video placeholder</title>
  <desc id="desc">A soft gradient background with a play icon indicating video content</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4861"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#g)" opacity="0.12"/>
  <rect x="80" y="60" width="1120" height="600" rx="24" fill="#ffffff" opacity="0.65"/>
  <g filter="url(#shadow)">
    <circle cx="640" cy="360" r="96" fill="#0f4861" opacity="0.92"/>
    <polygon points="610,310 710,360 610,410" fill="#ffffff"/>
  </g>
  <text x="640" y="540" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#0f4861" opacity="0.85">Video</text>
</svg>
